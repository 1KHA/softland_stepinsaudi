server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let React Router handle all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
